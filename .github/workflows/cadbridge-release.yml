name: CadBridge release

# Pushing a cadbridge-vX.Y.Z tag publishes cadbridge.zip (the cadbridge/ folder: installer, prebuilt plugin, MCP
# server) as a GitHub release, so users download about 100 KB instead of the whole repository:
# https://github.com/MuhammadAbbasi/cadbridge-mcp/releases/latest/download/cadbridge.zip
on:
  push:
    tags: ["cadbridge-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cadbridge.zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#cadbridge-v}"
          test "$(tr -d '\r\n' < cadbridge/VERSION)" = "$v" || { echo "cadbridge/VERSION is not $v"; exit 1; }
          awk -v h="## $v " 'index($0, h) == 1 {f = 1; next} /^## / {f = 0} f' cadbridge/CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $v"; exit 1; }
          zip -r -q cadbridge.zip cadbridge -x '*/__pycache__/*'
          gh release create "$GITHUB_REF_NAME" cadbridge.zip --title "CadBridge $v" --notes-file notes.md --latest
